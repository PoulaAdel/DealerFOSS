    Overview: the icon-pack badge - the mark on a disc inside a ring. One file
    at one size, because it is a vector: the brand sheet shows three sizes of
    the same drawing, not three drawings.

    Usage: documentation, and anywhere an application icon or avatar is wanted.

    Coding Instructions: THE PATH DATA IS A COPY AND MUST NOT DRIFT. The source
    is frontend/src/app/markPaths.ts and Mark.test.tsx fails if the two
    disagree. The scale and the ring's dimensions come from the same file.
  -->
