    Overview: the 1200x300 banner from the brand sheet of 2026-09-11 - the
    lockup on a dark woven ground - for the top of README.md.

    Usage: referenced from Markdown. Nothing in the application loads it.

    Coding Instructions: THE PATH DATA IS A COPY AND MUST NOT DRIFT. The source
    is frontend/src/app/markPaths.ts and Mark.test.tsx fails if the two
    disagree.

    THE GET A QUOTE BUTTON ON THE BRAND SHEET IS DELIBERATELY NOT HERE. This
    banner sits on the README of a repository, where a sales call to action
    would be addressed to nobody: the reader is a contributor or an operator,
    not a lead. The ground, the lockup and the proportions are the sheet's.

    The colours are the dark theme's lifted pair, unconditionally - there is no
    media query, because the ground is dark in both themes. The artwork teal
    measures 2.09:1 against this ground and would be a banner with a hole in it.
  -->
