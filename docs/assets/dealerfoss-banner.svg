      <rect width="8" height="8" fill="#1a1e23"/>
      <rect x="8" y="8" width="8" height="8" fill="#1a1e23"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#weave)"/>
  <rect width="1200" height="300" fill="none" stroke="#2b323a" stroke-width="2"/>

