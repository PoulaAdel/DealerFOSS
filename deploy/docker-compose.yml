# Local development dependencies for OpenDealer360.
#
# The small-install default needs only the application, SQL Server, and document
# storage (doc 07 §6). Redis and an OTel collector are OPTIONAL and live behind
# Compose profiles so a single-node dev loop stays lean.
#
#   Core (SQL Server only):     docker compose -f deploy/docker-compose.yml up -d
#   With Redis (scale-out dev):  docker compose -f deploy/docker-compose.yml --profile redis up -d
#   With telemetry collector:    docker compose -f deploy/docker-compose.yml --profile otel up -d

name: opendealer360-dev

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: odms-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      # Dev-only password. Never reuse in any shared or production environment.
      MSSQL_SA_PASSWORD: "OpenDealer360_dev!"
    ports:
      - "1433:1433"
    volumes:
      - ./.data/sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: odms-redis
    profiles: ["redis"]
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - ./.data/redis:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: odms-otel
    profiles: ["otel"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
