name: CI

# The project works on main only, so main is what CI watches. That makes CI a
# smoke alarm rather than a gate: it confirms after a push instead of blocking
# before one. The gate is local — nothing is committed until build, tests, and
# deploy/verify-e2e.ps1 pass on the developer's machine.
#
# workflow_dispatch gives a "Run workflow" button, so CI can be checked without
# inventing a commit. The pull_request trigger is kept for the rare risky change
# that gets its own short-lived branch; it costs nothing when unused.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, boundary, and SQL-backed tests
    runs-on: ubuntu-latest

    # A real SQL Server, so tenant isolation is proven in CI rather than mocked.
    # The image runs correctly on the Linux runner; some Windows/WSL2 developer
    # hosts cannot run it, which is why CLAUDE.md documents a LocalDB fallback.
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD || 'OpenDealer360_ci!' }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      OPENDEALER360_TEST_SQL: "Server=localhost,1433;Database=OpenDealer360_Host;User Id=sa;Password=${{ secrets.CI_SQL_PASSWORD || 'OpenDealer360_ci!' }};TrustServerCertificate=True;Encrypt=True"

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Restore runs NuGetAudit; TreatWarningsAsErrors fails the build on any
      # vulnerable or disallowed-license dependency (doc 06 §7, doc 08 §2).
      - name: Restore
        run: dotnet restore OpenDealer360.slnx

      - name: Build (warnings as errors)
        run: dotnet build OpenDealer360.slnx -c Release --no-restore

      - name: Test (unit, architecture, integration)
        run: dotnet test OpenDealer360.slnx -c Release --no-build --verbosity normal

  frontend:
    name: Frontend typecheck, tests, and build
    runs-on: ubuntu-latest

    # Separate from the backend job: it needs no database, so it should not wait
    # for one to become healthy, and a frontend break should be legible on its
    # own rather than buried in a SQL-backed run.
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # "ci" rather than "install": it installs exactly the lockfile and fails if
      # package.json and the lockfile disagree, which is the point of having one.
      - name: Install
        run: npm ci

      # An install that pulls a package with a known advisory fails here, the
      # same way NuGetAudit fails the backend build. react-router carried one
      # (GHSA-qwww-vcr4-c8h2) and it went unnoticed until somebody ran an audit
      # by hand — which is the argument for not leaving it to somebody.
      - name: Audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      # The screens are mounted into a real DOM and read the way a person would
      # read them. Before these existed, "the frontend has never been seen
      # rendering" was a limitation nobody could close without opening a browser.
      - name: Test
        run: npm test

      # Catches what a typecheck cannot — an unresolvable import, a broken asset
      # path, anything that only surfaces when the bundle is actually produced.
      - name: Build
        run: npm run build
